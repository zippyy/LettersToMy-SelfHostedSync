# Letters to My — Self-Hosted Sync Server
#
# Run: docker compose pull && docker compose up -d
#
# Provides a REST API for cross-platform syncing, backup storage,
# and attachment hosting. iOS, Android, and web clients all
# connect to this server.
#
# This compose file consumes the prebuilt multi-arch image from GHCR
# (linux/amd64 + linux/arm64) — no local build is needed. To run a local
# source build instead, replace `image:` with `build: .`.

services:
  api:
    image: ghcr.io/zippyy/letterstomy-selfhostedsync:latest
    ports:
      - "8080:8080"
    volumes:
      - data:/data
      - ./api_keys.txt:/etc/letters2my/api_keys.txt:ro
    environment:
      - DATA_DIR=/data
      - PORT=8080
      - API_KEYS_FILE=/etc/letters2my/api_keys.txt
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  data: